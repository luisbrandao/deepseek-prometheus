[pytest]
testpaths = tests
asyncio_mode = auto
# Every test drives the async functions directly; there is no event loop to
# share between them, so each test gets a fresh one.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
    # Third-party, raised at import inside starlette's own test client: anyio
    # 4.15+ deprecates the `anyio.abc.BlockingPortal` alias that starlette 1.6
    # still references. Not ours to fix, and it broke CI collection on the day
    # anyio shipped. Later filters win in pytest, so this only carves out that
    # one message — every other DeprecationWarning is still an error.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
